---
# apt
- name: Apt {{ systemd_container_apt_state }} systemd-container
  become: true
  ansible.builtin.apt:
    state: "{{ systemd_container_apt_state }}"
    name: systemd-container

# mkdir /var/lib/machines
- name: Mkdir /var/lib/machines
  become: true
  ansible.builtin.file:
    path: /var/lib/machines
    mode: u=rwx,g=,o=

# start/enable service
- name: Start/Enable systemd-machined.service
  become: true
  ansible.builtin.systemd_service:
    scope: system
    name: systemd-machined.service
    enabled: true
    state: started